<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube DJ</title>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-deck: #16161f;
      --border: #2a2a3a;
      --text-primary: #e0e0e8;
      --text-secondary: #8888aa;
      --accent-a: #00aaff;
      --accent-b: #ff4488;
      --accent-sync: #44ff88;
      --waveform-a: #00aaff;
      --waveform-b: #ff4488;
      --beat-marker: rgba(255, 255, 255, 0.5);
      --button-bg: #1e1e2e;
      --button-hover: #2a2a3e;
      --button-active: #3a3a4e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 8px;
      gap: 8px;
    }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 12px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* --- Waveform Area --- */
    .waveforms {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }
    .waveform-container {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    .waveform-container canvas {
      width: 100%;
      height: 100%;
    }
    .waveform-label {
      position: absolute;
      top: 4px;
      left: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
    }
    .waveform-label.deck-a { color: var(--accent-a); }
    .waveform-label.deck-b { color: var(--accent-b); }
    .waveform-info {
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0.8;
    }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: white;
      left: 50%;
      z-index: 10;
      pointer-events: none;
    }

    /* --- Deck Controls --- */
    .decks {
      display: flex;
      gap: 8px;
    }
    .deck {
      flex: 1;
      background: var(--bg-deck);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .deck-title {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .deck-bpm {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
    }
    .deck-bpm.deck-a { color: var(--accent-a); }
    .deck-bpm.deck-b { color: var(--accent-b); }

    /* --- URL Input --- */
    .url-input-row {
      display: flex;
      gap: 4px;
    }
    .url-input {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--text-primary);
      font-size: 12px;
      outline: none;
    }
    .url-input:focus {
      border-color: var(--accent-a);
    }
    .deck:nth-child(2) .url-input:focus {
      border-color: var(--accent-b);
    }

    /* --- Transport Controls --- */
    .transport {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .btn {
      background: var(--button-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 12px;
      padding: 6px 10px;
      transition: background 0.1s;
      font-family: inherit;
    }
    .btn:hover { background: var(--button-hover); }
    .btn:active { background: var(--button-active); }
    .btn.active {
      background: var(--accent-sync);
      color: #000;
      border-color: var(--accent-sync);
    }
    .btn-play {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .btn-play.playing {
      background: var(--accent-a);
      border-color: var(--accent-a);
      color: #000;
    }
    .deck:nth-child(2) .btn-play.playing {
      background: var(--accent-b);
      border-color: var(--accent-b);
    }

    /* --- Sliders --- */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .slider-row label {
      width: 40px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-primary);
      cursor: pointer;
    }
    .slider-value {
      width: 40px;
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
    }

    /* --- Sync Controls (center) --- */
    .sync-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--bg-deck);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 100px;
    }
    .sync-panel .btn-sync {
      width: 70px;
      height: 32px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .phase-meter {
      width: 80px;
      height: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .phase-meter-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-sync);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
      transition: left 0.05s;
    }

    /* --- Analysis Button --- */
    .btn-analyze {
      font-size: 11px;
      padding: 4px 8px;
    }
    .btn-analyze.analyzing {
      background: var(--accent-sync);
      color: #000;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* --- Time Display --- */
    .time-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>YouTube DJ</h1>
      <div class="time-display" id="masterTime">0:00.0</div>
    </div>

    <!-- Waveform displays -->
    <div class="waveforms">
      <div class="waveform-container" id="waveformA">
        <span class="waveform-label deck-a">Deck A</span>
        <span class="waveform-info" id="infoA">--.- BPM</span>
        <div class="playhead"></div>
        <canvas id="canvasA"></canvas>
      </div>
      <div class="waveform-container" id="waveformB">
        <span class="waveform-label deck-b">Deck B</span>
        <span class="waveform-info" id="infoB">--.- BPM</span>
        <div class="playhead"></div>
        <canvas id="canvasB"></canvas>
      </div>
    </div>

    <!-- Deck controls -->
    <div class="decks">
      <!-- Deck A -->
      <div class="deck" id="deckA">
        <div class="deck-header">
          <span class="deck-title" id="titleA">No track loaded</span>
          <span class="deck-bpm deck-a" id="bpmA">---</span>
        </div>
        <div class="url-input-row">
          <input type="text" class="url-input" id="urlA" placeholder="Paste YouTube URL...">
          <button class="btn" id="loadA">Load</button>
          <button class="btn btn-analyze" id="analyzeA">Analyze</button>
        </div>
        <div class="transport">
          <button class="btn" id="nudgeBackA">&lt;&lt;</button>
          <button class="btn btn-play" id="playA">&#9654;</button>
          <button class="btn" id="nudgeFwdA">&gt;&gt;</button>
          <button class="btn" id="syncA">Sync</button>
          <span class="time-display" id="timeA">0:00</span>
        </div>
        <div class="slider-row">
          <label>Rate</label>
          <input type="range" id="rateA" min="0.5" max="1.5" step="0.01" value="1.0">
          <span class="slider-value" id="rateValA">1.00x</span>
        </div>
        <div class="slider-row">
          <label>Vol</label>
          <input type="range" id="volA" min="0" max="1" step="0.01" value="1.0">
          <span class="slider-value" id="volValA">100%</span>
        </div>
      </div>

      <!-- Sync Panel (center) -->
      <div class="sync-panel">
        <button class="btn btn-sync" id="syncModeBtn">Sync</button>
        <div class="phase-meter">
          <div class="phase-meter-fill" id="phaseFill"></div>
        </div>
        <select class="btn" id="quantizeSelect" style="font-size:11px;">
          <option value="beat">Beat</option>
          <option value="bar">Bar</option>
          <option value="phrase">Phrase</option>
        </select>
      </div>

      <!-- Deck B -->
      <div class="deck" id="deckB">
        <div class="deck-header">
          <span class="deck-title" id="titleB">No track loaded</span>
          <span class="deck-bpm deck-b" id="bpmB">---</span>
        </div>
        <div class="url-input-row">
          <input type="text" class="url-input" id="urlB" placeholder="Paste YouTube URL...">
          <button class="btn" id="loadB">Load</button>
          <button class="btn btn-analyze" id="analyzeB">Analyze</button>
        </div>
        <div class="transport">
          <button class="btn" id="nudgeBackB">&lt;&lt;</button>
          <button class="btn btn-play" id="playB">&#9654;</button>
          <button class="btn" id="nudgeFwdB">&gt;&gt;</button>
          <button class="btn" id="syncB">Sync</button>
          <span class="time-display" id="timeB">0:00</span>
        </div>
        <div class="slider-row">
          <label>Rate</label>
          <input type="range" id="rateB" min="0.5" max="1.5" step="0.01" value="1.0">
          <span class="slider-value" id="rateValB">1.00x</span>
        </div>
        <div class="slider-row">
          <label>Vol</label>
          <input type="range" id="volB" min="0" max="1" step="0.01" value="1.0">
          <span class="slider-value" id="volValB">100%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
